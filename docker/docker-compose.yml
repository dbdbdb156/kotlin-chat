version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: kotlin_chat_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kotlin_chat
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  pg_data:

networks:
  backend: